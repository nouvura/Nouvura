<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOUVURA</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0e0105;
color:#fff;
overflow-x:hidden;
}

/* SCREENS */
.screen{
position:fixed;
top:0;left:0;width:100%;height:100%;
background:#0e0105;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:999;
opacity:0;
visibility:hidden;
transition:0.5s;
}
.screen.active{
opacity:1;
visibility:visible;
}

/* BUTTON */
button{
padding:10px 20px;
border:none;
background:#00f0ff;
cursor:pointer;
margin:10px;
}

/* HERO */
.hero{
position:relative;
height:100vh;
overflow:hidden;
}

.hero img{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
opacity:0;
animation:slide 20s infinite;
}

.hero img:nth-child(1){animation-delay:0s;}
.hero img:nth-child(2){animation-delay:5s;}
.hero img:nth-child(3){animation-delay:10s;}
.hero img:nth-child(4){animation-delay:15s;}

@keyframes slide{
0%{opacity:0;}
5%{opacity:1;}
25%{opacity:1;}
30%{opacity:0;}
100%{opacity:0;}
}

/* SERVICES */
.services{
padding:50px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#111;
padding:20px;
border-radius:10px;
text-align:center;
}

.card img{
width:100%;
height:150px;
object-fit:cover;
}

/* MODAL */
.modal{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.8);
display:none;
align-items:center;
justify-content:center;
}

.modal.active{display:flex;}

.modal-box{
background:#111;
padding:20px;
width:90%;
max-width:400px;
}

input,textarea{
width:100%;
margin:5px 0;
padding:10px;
}
</style>

</head>
<body>

<!-- LANGUAGE -->
<div id="lang" class="screen active">
<h1>Select Language</h1>
<button onclick="next()">FR</button>
<button onclick="next()">AR</button>
<button onclick="next()">EN</button>
</div>

<!-- PATH -->
<div id="path" class="screen">
<h1>Vous êtes ?</h1>
<button onclick="enter()">Entreprise</button>
<button onclick="enter()">Particulier</button>
</div>

<!-- MAIN -->
<div id="main" style="display:none">

<div class="hero">
<img src="02.jpg">
<img src="555.jpg">
<img src="flayer.jpg">
<img src="habillage.jpg">
</div>

<h1 style="text-align:center">Services</h1>

<div class="services">

<div class="card">
<img src="https://raw.githubusercontent.com/nouvura/Nouvura/main/Conception%20Web.png">
<h3>Conception Web</h3>
</div>

<div class="card">
<img src="https://raw.githubusercontent.com/nouvura/Nouvura/main/Cr%C3%A9ation%20de%20contenu%2C.png">
<h3>Réseaux Sociaux</h3>
</div>

<div class="card">
<img src="https://raw.githubusercontent.com/nouvura/Nouvura/main/Des%20interfaces%20belles.png">
<h3>UI/UX</h3>
</div>

<div class="card">
<img src="https://raw.githubusercontent.com/nouvura/Nouvura/main/Optimisation%20Web.png">
<h3>Optimisation</h3>
</div>

<div class="card">
<img src="https://raw.githubusercontent.com/nouvura/Nouvura/main/D%C3%A9coupe%20CNC%20%26%20Laser.png">
<h3>CNC & Laser</h3>
</div>

<div class="card">
<img src="https://raw.githubusercontent.com/nouvura/Nouvura/main/Habillage%20V%C3%A9hicules.png">
<h3>Habillage Véhicules</h3>
</div>

<div class="card">
<img src="https://raw.githubusercontent.com/nouvura/Nouvura/main/Signal%C3%A9tique%20%26%20Panneaux%20Publicitaires.png">
<h3>Signalétique</h3>
</div>

<div class="card">
<img src="https://raw.githubusercontent.com/nouvura/Nouvura/main/Branding%20%26%20Impression.png">
<h3>Branding</h3>
</div>

<div class="card">
<img src="https://raw.githubusercontent.com/nouvura/Nouvura/main/Impression%20DTF.png">
<h3>DTF</h3>
</div>

<div class="card">
<img src="https://raw.githubusercontent.com/nouvura/Nouvura/main/Affiches.png">
<h3>Affiches</h3>
</div>

<div class="card">
<img src="https://raw.githubusercontent.com/nouvura/Nouvura/main/Cartes%20de%20Visite%20%26%20D%C3%A9pliants.png">
<h3>Cartes</h3>
</div>

<div class="card">
<img src="https://raw.githubusercontent.com/nouvura/Nouvura/main/Autocollants.png">
<h3>Autocollants</h3>
</div>

</div>

<div style="text-align:center">
<button onclick="openForm()">طلب الآن</button>
</div>

</div>

<!-- FORM -->
<div id="form" class="modal">
<div class="modal-box">
<h2>طلب خدمة</h2>
<input placeholder="Nom">
<input placeholder="Service">
<input placeholder="WhatsApp">
<textarea placeholder="Details"></textarea>
<button onclick="send()">Envoyer</button>
<button onclick="closeForm()">Close</button>
</div>
</div>

<script>
function next(){
document.getElementById("lang").classList.remove("active");
document.getElementById("path").classList.add("active");
}

function enter(){
document.getElementById("path").classList.remove("active");
document.getElementById("main").style.display="block";
}

function openForm(){
document.getElementById("form").classList.add("active");
}

function closeForm(){
document.getElementById("form").classList.remove("active");
}

function send(){
alert("تم الإرسال");
}
</script>

</body>
</html>
