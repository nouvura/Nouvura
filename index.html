<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOUVURA SYSTEM</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   NOUVURA SYSTEM — CORE VARIABLES
═══════════════════════════════════════════ */
:root {
  --cyan: #00f0ff;
  --cyan-dim: rgba(0,240,255,0.15);
  --cyan-glow: rgba(0,240,255,0.6);
  --cyan-ultra: rgba(0,240,255,0.03);
  --bg-deep: #0e0105;
  --bg-panel: rgba(20, 2, 8, 0.85);
  --text: #ffffff;
  --text-dim: rgba(255,235,240,0.75);
  --border: rgba(0,240,255,0.18);
  --border-bright: rgba(0,240,255,0.45);
  --radius: 8px;
  --transition: cubic-bezier(0.4, 0, 0.2, 1);
}

/* ═══════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html { scroll-behavior: smooth; }

body {
  background: linear-gradient(160deg, #1a0005 0%, #0e0105 40%, #180008 70%, #100003 100%);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  overflow-x: hidden;
  cursor: none;
  letter-spacing: 0.03em;
}

::selection { background: var(--cyan-dim); color: var(--cyan); }

/* ═══════════════════════════════════════════
   BACKGROUND SYSTEM
═══════════════════════════════════════════ */
.bg-layer {
  position: fixed;
  inset: 0;
  z-index: -3;
}

.bg-image {
  position: fixed;
  inset: 0;
  z-index: -4;
  background: url('background.png') center/cover no-repeat;
  transform-origin: center;
  animation: bgDrift 30s ease-in-out infinite alternate;
  filter: brightness(0.28) saturate(1.4);
}

/* Red gradient overlay over background */
.bg-gradient-overlay {
  position: fixed;
  inset: 0;
  z-index: -3;
  background: linear-gradient(
    135deg,
    rgba(80, 0, 0, 0.72) 0%,
    rgba(40, 0, 10, 0.60) 35%,
    rgba(10, 2, 20, 0.55) 65%,
    rgba(60, 0, 15, 0.68) 100%
  );
  pointer-events: none;
}

@keyframes bgDrift {
  0%   { transform: scale(1.06) translate(0,0); }
  33%  { transform: scale(1.1) translate(-1%,-0.5%); }
  66%  { transform: scale(1.06) translate(1%,0.5%); }
  100% { transform: scale(1.09) translate(-0.5%,1%); }
}

/* Grid Overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,240,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,240,255,0.04) 1px, transparent 1px);
  background-size: 44px 44px;
  z-index: -2;
  pointer-events: none;
}

/* Vignette */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(2,6,17,0.75) 100%);
  z-index: -1;
  pointer-events: none;
}

/* ═══════════════════════════════════════════
   PARTICLES CANVAS
═══════════════════════════════════════════ */
#particleCanvas {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: 0.55;
}

/* ═══════════════════════════════════════════
   CUSTOM CURSOR
═══════════════════════════════════════════ */
.cursor-dot {
  position: fixed;
  width: 8px;
  height: 8px;
  background: var(--cyan);
  border-radius: 50%;
  pointer-events: none;
  z-index: 10000;
  transition: transform 0.1s var(--transition);
  box-shadow: 0 0 12px var(--cyan), 0 0 24px var(--cyan-glow);
  transform: translate(-50%, -50%);
}

.cursor-ring {
  position: fixed;
  width: 36px;
  height: 36px;
  border: 1px solid rgba(0,240,255,0.5);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  transition: width 0.3s var(--transition), height 0.3s var(--transition),
              border-color 0.3s, opacity 0.3s;
}

.cursor-trail {
  position: fixed;
  width: 4px;
  height: 4px;
  background: var(--cyan);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  opacity: 0;
  transform: translate(-50%, -50%);
}

body.cursor-hover .cursor-ring {
  width: 56px;
  height: 56px;
  border-color: var(--cyan);
  box-shadow: 0 0 20px var(--cyan-dim);
}

@media (max-width: 768px) {
  .cursor-dot, .cursor-ring, .cursor-trail { display: none; }
  body { cursor: default; }
}

/* ═══════════════════════════════════════════
   LANGUAGE SWITCH
═══════════════════════════════════════════ */
.lang {
  position: fixed;
  top: 24px;
  right: 24px;
  z-index: 500;
  display: flex;
  gap: 6px;
  backdrop-filter: blur(10px);
}

.lang button {
  background: rgba(0,240,255,0.05);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 6px 14px;
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.1em;
  cursor: none;
  border-radius: 3px;
  transition: all 0.25s var(--transition);
  position: relative;
  overflow: hidden;
}

.lang button::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--cyan-dim);
  transform: translateX(-100%);
  transition: transform 0.3s var(--transition);
}

.lang button:hover::before { transform: translateX(0); }

.lang button:hover {
  color: var(--cyan);
  border-color: var(--cyan);
  box-shadow: 0 0 14px rgba(0,240,255,0.2);
}

.lang button.active {
  color: var(--cyan);
  border-color: var(--cyan);
  background: rgba(0,240,255,0.08);
  box-shadow: 0 0 16px rgba(0,240,255,0.25);
}

/* ═══════════════════════════════════════════
   SYSTEM BAR (TOP)
═══════════════════════════════════════════ */
.system-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  z-index: 600;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  animation: scanBar 4s ease-in-out infinite;
  opacity: 0.7;
}

@keyframes scanBar {
  0%, 100% { opacity: 0.3; transform: scaleX(0.3); transform-origin: left; }
  50% { opacity: 0.8; transform: scaleX(1); transform-origin: left; }
}

/* ═══════════════════════════════════════════
   HERO SECTION
═══════════════════════════════════════════ */
.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  position: relative;
  padding: 0 20px;
}

/* Aura ring behind logo */
.hero-aura {
  position: absolute;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(0,240,255,0.07) 0%, transparent 70%);
  animation: auraBreath 4s ease-in-out infinite;
  pointer-events: none;
}

@keyframes auraBreath {
  0%, 100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.15); opacity: 1; }
}

/* Orbit rings — removed */
.orbit-ring { display: none; }

.logo-wrap {
  position: relative;
  margin-bottom: 28px;
  animation: logoReveal 1.2s var(--transition) both;
}

@keyframes logoReveal {
  from { opacity: 0; transform: scale(0.7) translateY(20px); filter: blur(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
}

.logo-glow-ring {
  position: absolute;
  inset: -16px;
  border-radius: 18px;
  border: 1px solid rgba(0,240,255,0.22);
  animation: glowRingPulse 3s ease-in-out infinite;
}

.logo-glow-ring::before {
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: 22px;
  border: 1px solid rgba(0,240,255,0.10);
  animation: glowRingPulse 3s ease-in-out infinite 0.5s;
}

@keyframes glowRingPulse {
  0%, 100% { box-shadow: 0 0 10px rgba(0,240,255,0.15); opacity: 0.8; }
  50% { box-shadow: 0 0 30px rgba(0,240,255,0.35); opacity: 1; }
}

.logo-box {
  background: linear-gradient(135deg, rgba(0,240,255,0.12), rgba(0,240,255,0.06));
  padding: 18px 22px;
  border-radius: 12px;
  border: 1px solid rgba(0,240,255,0.3);
  box-shadow: 0 0 30px rgba(0,240,255,0.2), inset 0 0 20px rgba(0,240,255,0.04);
  position: relative;
  overflow: hidden;
}

.logo-box::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(45deg, transparent 30%, rgba(0,240,255,0.06) 50%, transparent 70%);
  animation: logoSheen 4s linear infinite;
}

@keyframes logoSheen {
  from { transform: translateX(-100%) rotate(0deg); }
  to { transform: translateX(100%) rotate(0deg); }
}

.logo-box img {
  width: 90px;
  filter: brightness(0) invert(1) drop-shadow(0 0 8px rgba(0,240,255,0.6));
  display: block;
  position: relative;
  z-index: 1;
}

.hero h1 {
  font-family: 'Orbitron', sans-serif;
  color: var(--cyan);
  font-size: clamp(36px, 8vw, 80px);
  font-weight: 900;
  letter-spacing: 0.18em;
  text-shadow: 0 0 30px var(--cyan), 0 0 60px rgba(0,240,255,0.35), 0 0 100px rgba(0,240,255,0.15);
  animation: titleReveal 1.4s var(--transition) 0.3s both;
  position: relative;
}

@keyframes titleReveal {
  from { opacity: 0; transform: translateY(30px); letter-spacing: 0.4em; }
  to { opacity: 1; transform: translateY(0); letter-spacing: 0.18em; }
}

.hero-slogan {
  font-size: clamp(13px, 2vw, 17px);
  color: var(--text-dim);
  letter-spacing: 0.25em;
  text-transform: uppercase;
  margin-top: 14px;
  animation: fadeUp 1.2s var(--transition) 0.6s both;
  font-weight: 300;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Scan line on hero */
.hero-scan {
  position: absolute;
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,240,255,0.35), transparent);
  animation: heroScan 6s ease-in-out infinite;
  pointer-events: none;
}

@keyframes heroScan {
  0% { top: 0%; opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { top: 100%; opacity: 0; }
}

/* Corner decorations */
.hero-corner {
  position: absolute;
  width: 28px;
  height: 28px;
  border-color: rgba(0,240,255,0.35);
  border-style: solid;
  opacity: 0.6;
}

.hero-corner.tl { top: 60px; left: 40px; border-width: 2px 0 0 2px; }
.hero-corner.tr { top: 60px; right: 40px; border-width: 2px 2px 0 0; }
.hero-corner.bl { bottom: 40px; left: 40px; border-width: 0 0 2px 2px; }
.hero-corner.br { bottom: 40px; right: 40px; border-width: 0 2px 2px 0; }

/* ═══════════════════════════════════════════
   CONNECTION LINES
═══════════════════════════════════════════ */
.connection {
  width: 2px;
  height: 60px;
  background: linear-gradient(to bottom, transparent, var(--cyan), transparent);
  margin: 0 auto;
  position: relative;
  overflow: hidden;
}

.connection::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 20px;
  background: linear-gradient(to bottom, transparent, #fff, transparent);
  animation: flow 2s linear infinite;
  box-shadow: 0 0 6px var(--cyan);
}

@keyframes flow {
  0% { top: -20px; opacity: 0; }
  20% { opacity: 1; }
  80% { opacity: 1; }
  100% { top: 100%; opacity: 0; }
}

/* Energy line with nodes */
.energy-line {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  margin: 10px auto;
  position: relative;
}

.energy-node {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 10px var(--cyan);
  animation: nodePulse 2s ease-in-out infinite;
}

@keyframes nodePulse {
  0%, 100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.4); opacity: 1; }
}

/* ═══════════════════════════════════════════
   SECTIONS / LAYERS
═══════════════════════════════════════════ */
.layer {
  border: 1px solid var(--border);
  margin: 48px auto;
  padding: 40px 36px;
  max-width: 1100px;
  border-radius: var(--radius);
  opacity: 0;
  transform: translateY(48px);
  transition: opacity 0.9s var(--transition), transform 0.9s var(--transition);
  background: var(--bg-panel);
  backdrop-filter: blur(12px);
  position: relative;
  overflow: hidden;
}

/* Corner accents on layers */
.layer::before, .layer::after {
  content: '';
  position: absolute;
  width: 16px;
  height: 16px;
  border-color: var(--cyan);
  border-style: solid;
  opacity: 0.5;
  transition: opacity 0.3s;
}

.layer::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; border-radius: 2px 0 0 0; }
.layer::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; border-radius: 0 0 2px 0; }

.layer:hover::before, .layer:hover::after { opacity: 1; }

/* Subtle inner glow */
.layer .layer-inner-glow {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(0,240,255,0.04) 0%, transparent 60%);
  pointer-events: none;
}

.layer.show {
  opacity: 1;
  transform: translateY(0);
}

/* Section headers */
.section-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 32px;
}

.section-header h2 {
  font-family: 'Orbitron', sans-serif;
  color: var(--cyan);
  font-size: clamp(16px, 2.5vw, 22px);
  font-weight: 700;
  letter-spacing: 0.15em;
  text-shadow: 0 0 20px rgba(0,240,255,0.4);
}

.section-tag {
  font-family: 'Orbitron', sans-serif;
  font-size: 9px;
  font-weight: 500;
  color: rgba(0,240,255,0.5);
  letter-spacing: 0.2em;
  border: 1px solid rgba(0,240,255,0.2);
  padding: 3px 8px;
  border-radius: 2px;
  text-transform: uppercase;
}

.section-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--border-bright), transparent);
}

/* ═══════════════════════════════════════════
   SERVICE CARDS
═══════════════════════════════════════════ */
.services-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 14px;
}

.card {
  border: 1px solid var(--border);
  padding: 22px 16px;
  text-align: center;
  cursor: none;
  transition: all 0.35s var(--transition);
  border-radius: 6px;
  background: rgba(0,240,255,0.02);
  position: relative;
  overflow: hidden;
  font-family: 'Orbitron', sans-serif;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.12em;
  color: var(--text-dim);
}

.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(0,240,255,0.07), transparent);
  opacity: 0;
  transition: opacity 0.3s;
}

.card::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 2px;
  background: var(--cyan);
  transition: width 0.35s var(--transition);
  box-shadow: 0 0 8px var(--cyan);
}

.card:hover, .card.active {
  border-color: rgba(0,240,255,0.55);
  box-shadow: 0 0 24px rgba(0,240,255,0.15), inset 0 0 20px rgba(0,240,255,0.04);
  color: var(--cyan);
  transform: translateY(-3px);
}

.card:hover::before, .card.active::before { opacity: 1; }
.card:hover::after, .card.active::after { width: 60%; }

.card-icon {
  font-size: 22px;
  margin-bottom: 10px;
  display: block;
  opacity: 0.7;
  transition: opacity 0.3s, transform 0.3s;
}

.card:hover .card-icon { opacity: 1; transform: scale(1.1); }

.card-title {
  display: block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.card span.desc {
  display: block;
  font-size: 9px;
  color: rgba(0,240,255,0.45);
  letter-spacing: 0.08em;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 300;
  margin-top: 6px;
  height: 0;
  overflow: hidden;
  transition: height 0.3s var(--transition), opacity 0.3s;
  opacity: 0;
}

.card.active span.desc {
  height: 20px;
  opacity: 1;
}

/* ═══════════════════════════════════════════
   PORTFOLIO SECTION
═══════════════════════════════════════════ */
.portfolio {
  border: 1px solid var(--border);
  margin: 48px auto;
  padding: 40px 36px;
  max-width: 1100px;
  border-radius: var(--radius);
  opacity: 0;
  transform: translateY(48px);
  transition: opacity 0.9s var(--transition), transform 0.9s var(--transition);
  background: var(--bg-panel);
  backdrop-filter: blur(12px);
  position: relative;
  overflow: hidden;
}

.portfolio.show { opacity: 1; transform: translateY(0); }

.portfolio::before {
  content: '';
  position: absolute;
  top: -1px; left: -1px;
  width: 16px; height: 16px;
  border: 2px solid var(--cyan);
  border-right: none; border-bottom: none;
  border-radius: 2px 0 0 0;
  opacity: 0.5;
}

.portfolio::after {
  content: '';
  position: absolute;
  bottom: -1px; right: -1px;
  width: 16px; height: 16px;
  border: 2px solid var(--cyan);
  border-left: none; border-top: none;
  border-radius: 0 0 2px 0;
  opacity: 0.5;
}

.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  margin-top: 10px;
}

.portfolio-item {
  position: relative;
  cursor: none;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid var(--border);
  aspect-ratio: 4/3;
  background: rgba(0,240,255,0.03);
  transition: all 0.4s var(--transition);
}

.portfolio-item::before {
  content: '';
  position: absolute;
  inset: 0;
  border: 2px solid transparent;
  border-radius: 6px;
  background: linear-gradient(135deg, rgba(0,240,255,0.3), rgba(0,240,255,0.05), transparent) border-box;
  -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: destination-out;
  mask-composite: exclude;
  opacity: 0;
  transition: opacity 0.35s;
  pointer-events: none;
  z-index: 2;
}

.portfolio-item::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 50%, rgba(2,6,17,0.85) 100%);
  z-index: 1;
  pointer-events: none;
  transition: opacity 0.35s;
  opacity: 0.5;
}

.portfolio-item:hover {
  transform: translateY(-6px) scale(1.015);
  box-shadow:
    0 0 0 1px rgba(0,240,255,0.4),
    0 0 30px rgba(0,240,255,0.2),
    0 20px 40px rgba(0,0,0,0.5);
  border-color: rgba(0,240,255,0.4);
}

.portfolio-item:hover::before { opacity: 1; }
.portfolio-item:hover::after { opacity: 0.8; }

.portfolio-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.5s var(--transition), filter 0.4s;
}

.portfolio-item:hover img {
  transform: scale(1.07);
  filter: brightness(0.8) saturate(1.2);
}

/* 3D tilt via JS — vars applied inline */
.portfolio-item.tilt {
  transform: perspective(800px) rotateX(var(--rotX,0)) rotateY(var(--rotY,0)) translateY(-4px) scale(1.02);
  box-shadow: 0 0 30px rgba(0,240,255,0.18), 0 16px 40px rgba(0,0,0,0.45);
  border-color: rgba(0,240,255,0.45);
}

.portfolio-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 16px;
  z-index: 3;
  transform: translateY(8px);
  opacity: 0;
  transition: all 0.35s var(--transition);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.portfolio-item:hover .portfolio-overlay {
  transform: translateY(0);
  opacity: 1;
}

.portfolio-label {
  font-family: 'Orbitron', sans-serif;
  font-size: 9px;
  color: var(--cyan);
  letter-spacing: 0.15em;
  text-shadow: 0 0 8px var(--cyan);
}

.portfolio-expand {
  width: 28px;
  height: 28px;
  border: 1px solid rgba(0,240,255,0.5);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--cyan);
  background: rgba(0,240,255,0.08);
  transition: all 0.2s;
}

.portfolio-item:hover .portfolio-expand {
  background: rgba(0,240,255,0.18);
  box-shadow: 0 0 14px rgba(0,240,255,0.4);
}

/* Corner scan effect on portfolio items */
.portfolio-item .scan {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  z-index: 4;
  transform: translateY(-100%);
  transition: transform 0s;
  opacity: 0;
}

.portfolio-item:hover .scan {
  animation: itemScan 0.6s var(--transition) forwards;
}

@keyframes itemScan {
  from { transform: translateY(0); opacity: 0.7; }
  to { transform: translateY(200px); opacity: 0; }
}
